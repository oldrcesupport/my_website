services:
  db:
    image: postgres:18
    container_name: ticketing_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant_ticketing
      POSTGRES_USER: ticketing_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing_user -d restaurant_ticketing"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
